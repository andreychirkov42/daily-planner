<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clepsy</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // ошибки JS записываются в атрибут — их проверяет автотест перед сборкой
  (() => {
    const errs = [];
    const put = msg => { if (errs.includes(msg) || errs.length > 8) return; errs.push(msg); document.documentElement.dataset.errors = errs.join(" | "); };
    addEventListener("error", e => put(e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno));
    addEventListener("unhandledrejection", e => put("promise: " + (e.reason && e.reason.message || e.reason)));
  })();
</script>
<style>
  :root {
    --bg: #121822; --card: #19212e; --card-2: #202a3a; --line: #283346;
    --ink: #eef3fb; --ink-2: #9eabc0; --ink-3: #64728a;
    --accent: #4f8cff; --accent-soft: rgba(79,140,255,.16);
    --green: #4fb3ff; --green-soft: rgba(79,163,255,.13); --grad: linear-gradient(135deg, #2f6bff, #19b5ff);
    --p1: #8796b3; --p2: #f0a03c; --p3: #ff5d55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 13px/1.4 "Manrope", system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; user-select: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .banner { background: linear-gradient(180deg, var(--green-soft), rgba(79,163,255,.04)); border-bottom: 1px solid rgba(79,163,255,.35); padding: 12px 14px 12px; }
  .banner-top { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 600; text-transform: capitalize; }
  .banner-top .x { margin-left: auto; border: 0; background: none; color: var(--ink-3); font-size: 15px; padding: 0 2px; }
  .banner-top .x:hover { color: var(--ink); }
  .mood { margin: 8px 0 0 22px; color: var(--ink); }
  .bar { height: 4px; background: rgba(255,255,255,.07); border-radius: 4px; margin: 10px 0 0 22px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--grad); border-radius: 4px; transition: width .4s; }

  .brand { display: flex; align-items: center; gap: 10px; padding: 12px 14px 4px; }
  .brand b { font-size: 15px; font-weight: 800; }
  .brand .stats { margin-left: auto; display: flex; gap: 10px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats .ok { color: var(--green); }
  .stats .late { color: var(--p3); }
  .stats .left { color: var(--ink-2); }

  .running { margin: 8px 14px 0; display: flex; align-items: center; gap: 8px; background: var(--green-soft); border: 1px solid rgba(79,163,255,.3); border-radius: 9px; padding: 6px 8px 6px 10px; font-weight: 600; }
  .running .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .running .clock { color: var(--green); font-variant-numeric: tabular-nums; font-weight: 800; }
  .running button { border: 0; background: rgba(255,255,255,.08); border-radius: 6px; padding: 2px 8px; }

  .pomo { margin: 10px 14px 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px; }
  .pomo.work { --pm: #4f8cff; } .pomo.short { --pm: #2fd0c0; } .pomo.long { --pm: #a78bfa; }
  .pomo-row { display: flex; align-items: center; gap: 8px; }
  .pomo-modes { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 2px; }
  .pomo-modes button { border: 0; background: none; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 800; color: var(--ink-3); }
  .pomo-modes button.on { background: color-mix(in srgb, var(--pm) 22%, transparent); color: var(--pm); }
  .pomo-count { margin-left: auto; font-size: 12px; letter-spacing: 1px; }
  .pomo-main { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .pomo-time { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; line-height: 1.1; }
  .pomo.is-running .pomo-time { color: var(--pm); }
  .pomo-ctrl { margin-left: auto; display: flex; gap: 6px; }
  .pbtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); display: grid; place-items: center; font-size: 13px; color: var(--ink-2); }
  .pbtn:hover { color: var(--ink); border-color: var(--ink-3); }
  .pbtn.primary { width: 44px; background: var(--pm); border-color: transparent; color: #fff; font-size: 15px; }
  .pomo-bar { height: 4px; border-radius: 4px; background: var(--bg); margin-top: 8px; overflow: hidden; }
  .pomo-bar i { display: block; height: 100%; width: 0; background: var(--pm); border-radius: 4px; transition: width .5s linear; }
  .pomo-label { font-size: 11.5px; color: var(--ink-2); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 16px; }
  .pomo.ring { animation: ring .6s ease 3; }
  .pomo-time { cursor: text; border-radius: 8px; padding: 0 4px; margin-left: -4px; transition: background .15s; }
  .pomo-time:hover { background: var(--card-2); }
  .clock-input { width: 130px; font: inherit; color: var(--pm); background: var(--bg); border: 1px solid var(--pm); border-radius: 8px; padding: 0 6px; outline: 0; }
  .clock-arrows { display: flex; flex-direction: column; gap: 2px; }
  .clock-arrows button { width: 24px; height: 17px; border: 1px solid var(--line); background: var(--card-2); border-radius: 5px; font-size: 9px; color: var(--ink-3); display: grid; place-items: center; padding: 0; user-select: none; touch-action: none; }
  .clock-arrows button:hover { color: var(--pm); border-color: var(--pm); }
  .clock-arrows button:active { background: color-mix(in srgb, var(--pm) 25%, var(--card-2)); }
  .pgear { border: 0; background: none; color: var(--ink-3); font-size: 15px; padding: 2px 4px; border-radius: 6px; }
  .pgear:hover, .pgear.on { color: var(--ink); background: var(--card-2); }
  .pset { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .pset-presets { display: flex; gap: 4px; margin-bottom: 2px; }
  .pset-chip { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 4px 0; font-size: 11.5px; font-weight: 800; color: var(--ink-2); }
  .pset-chip.on { border-color: var(--pm); color: var(--pm); }
  .pset-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
  .pset-row span { flex: 1; }
  .pset-row input[type=number] { width: 58px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; text-align: center; font-weight: 700; outline: 0; user-select: text; }
  .pset-row input[type=number]:focus { border-color: var(--pm); }
  .pset-row em { font-style: normal; width: 52px; color: var(--ink-3); font-size: 11.5px; }
  .pset-check { cursor: pointer; }
  .pset-check input { accent-color: var(--pm); width: 15px; height: 15px; }
  .pset-err { color: var(--p3); font-size: 11.5px; min-height: 0; }
  .pset-actions { display: flex; justify-content: flex-end; gap: 6px; }
  .pset-actions button { border: 1px solid var(--line); background: var(--card-2); border-radius: 7px; padding: 5px 12px; font-weight: 700; font-size: 12px; }
  .pset-actions .pset-save { background: var(--pm); border-color: transparent; color: #fff; }
  @keyframes ring { 30% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--pm) 45%, transparent); } }
  /* линейные иконки (icons.js) */
  .i { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.18em; }
  .i.inline { width: 1em; height: 1em; }
  .banner-top .i { width: 16px; height: 16px; color: #ffb35c; }
  .pgear .i { width: 16px; height: 16px; display: block; }
  .pbtn .i { width: 15px; height: 15px; }
  .pbtn.primary .i { width: 16px; height: 16px; stroke-width: 2.2; }
  .btn .i { width: 15px; height: 15px; }
  .stats .i { width: 13px; height: 13px; stroke-width: 2.2; }
  .running .i { width: 15px; height: 15px; color: var(--green); }
  .running button .i { width: 13px; height: 13px; }
  .sub .i { width: 11.5px; height: 11.5px; stroke-width: 2; }
  .title .i { width: 13px; height: 13px; color: var(--accent); }
  .play .i { width: 14px; height: 14px; }
  .add span .i { width: 16px; height: 16px; stroke-width: 2.2; display: block; }
  .empty b .i { width: 34px; height: 34px; stroke-width: 1.4; margin: 0 auto 4px; display: block; }
  .tomato { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pm, #4f8cff); margin: 0 1.5px; vertical-align: middle; }
  .tabs { display: flex; gap: 2px; margin: 12px 14px 0; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 7px 0; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--ink-2); }
  .tabs button.on { background: rgba(79,163,255,.14); color: var(--green); }
  .tabs .n { opacity: .7; margin-left: 3px; }

  .add { cursor: text; display: flex; align-items: center; gap: 8px; margin: 10px 14px 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
  .add:focus-within { border-color: var(--accent); }
  .add span { color: var(--accent); font-weight: 800; font-size: 16px; }
  .add input { flex: 1; border: 0; outline: 0; background: none; padding: 9px 0; user-select: text; }
  .add input::placeholder { color: var(--ink-3); }

  .label { padding: 12px 16px 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

  .item { display: flex; align-items: center; gap: 11px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; transition: background .15s, border-color .15s, opacity .25s, transform .25s; }
  .item:hover { background: var(--card-2); }
  .item.gone { opacity: 0; transform: translateX(20px); }
  .item.enter { animation: pop .3s cubic-bezier(.2,.8,.3,1.2) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .title { transition: color .3s; }
  .check { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--pc, var(--ink-3)); background: none; display: grid; place-items: center; padding: 0; }
  .check:hover { background: color-mix(in srgb, var(--pc, var(--ink-3)) 18%, transparent); }
  .check svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .1s; }
  .item.done .check { background: var(--grad); border-color: transparent; }
  .item.done .check svg { opacity: 1; }
  .check svg path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .05s ease; }
  .item.done .check svg path { stroke-dashoffset: 0; }
  .check { transition: background .25s, border-color .25s; }
  .item.done .title { text-decoration: line-through; color: var(--ink-3); }
  .p1 { --pc: var(--p1); } .p2 { --pc: var(--p2); } .p3 { --pc: var(--p3); }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub .late { color: var(--p3); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; }
  .play { flex: none; border: 0; background: none; color: var(--ink-3); width: 26px; height: 26px; border-radius: 7px; font-size: 12px; }
  .play:hover { background: var(--card-2); color: var(--ink); }
  .play.on { color: var(--green); }

  .empty { text-align: center; color: var(--ink-3); padding: 36px 10px; }
  .empty b { display: block; font-size: 30px; margin-bottom: 4px; }

  .foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; font-weight: 700; }
  .btn:hover { border-color: var(--ink-3); }
  .btn.ghost { margin-left: auto; color: var(--ink-3); }
  .pomo { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="banner">
    <div class="banner-top"><i data-i="sun"></i> <span id="date"></span><button class="x" id="closeBtn" title="Скрыть (Esc)">×</button></div>
    <div class="mood" id="mood"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="brand">
    <img src="icon.png" alt="" style="width:22px;height:22px;border-radius:6px"><b>Clepsy</b>
    <button class="pgear" id="sketchBtn" title="Холст для набросков" style="margin-left:4px"><i data-i="pen"></i></button>
    <div class="stats" id="stats"></div>
  </div>
  <div id="running"></div>

  <div class="pomo work" id="pomo">
    <div class="pomo-row">
      <div class="pomo-modes">
        <button data-pm="work" class="on">ФОКУС</button><button data-pm="short">ПЕРЕРЫВ</button><button data-pm="long">ДЛИННЫЙ</button>
      </div>
      <span class="pomo-count" id="pomoCount" title="Фокус-сессий сегодня"></span>
      <button class="pgear" id="pomoGear" title="Настроить время"><i data-i="settings"></i></button>
    </div>
    <div class="pomo-main">
      <div class="pomo-time" id="pomoTime" title="Нажми, чтобы ввести своё время, или крути колёсико">25:00</div>
      <div class="clock-arrows"><button type="button" data-adj="1" title="+1 минута">▲</button><button type="button" data-adj="-1" title="−1 минута">▼</button></div>
      <div class="pomo-ctrl">
        <button class="pbtn" id="pomoReset" title="Сначала"><i data-i="reset"></i></button>
        <button class="pbtn" id="pomoSkip" title="Пропустить"><i data-i="skip"></i></button>
        <button class="pbtn primary" id="pomoGo" title="Старт / пауза"><i data-i="play"></i></button>
      </div>
    </div>
    <div class="pomo-bar"><i id="pomoBar"></i></div>
    <div class="pomo-label" id="pomoLabel"></div>
    <div id="pomoSettings" hidden></div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="today" class="on">СЕГОДНЯ<span class="n"></span></button>
    <button data-tab="late">ПРОСРОЧЕНО<span class="n"></span></button>
    <button data-tab="tomorrow">ЗАВТРА<span class="n"></span></button>
  </div>

  <form class="add" id="addForm" autocomplete="off">
    <span><i data-i="plus"></i></span><input id="addInput" placeholder="Новая задача… «в 18:00 !3 #дом»">
  </form>

  <div class="label" id="label">Задачи</div>
  <div class="list" id="list"></div>

  <div class="foot">
    <button class="btn" id="openBtn" title="Окно программы"><i data-i="monitor"></i> Открыть</button>
    <button class="btn" id="browserBtn" title="Открыть страницу в браузере"><i data-i="globe"></i> В браузере</button>
    <button class="btn ghost" id="quitBtn" title="Закрыть программу"><i data-i="power"></i> Выход</button>
  </div>

<script src="icons.js"></script>
<script src="shared.js"></script>
<script>
"use strict";
const P = { tasks: [], lists: [], tab: "today" };
hydrateIcons(); // <i data-i> в разметке → SVG
const $ = s => document.querySelector(s);
const CHECK = `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const MOODS = [
  [0, "Начни с малого — всего одна задача"],
  [1, "Разгон взят, так держать"],
  [50, "Половина позади"],
  [80, "Финишная прямая — ещё чуть-чуть"],
  [100, "Всё сделано на сегодня"],
];

// функции, которые предоставляет Go-обёртка окна (в обычном браузере их нет)
const host = name => (...a) => (typeof window[name] === "function" ? window[name](...a) : null);
const hidePopup = host("hidePopup"), openMain = host("openMain"), openInBrowser = host("openInBrowser"), quitApp = host("quitApp");

async function api(method, path, body) {
  const r = await fetch("/api" + path, {
    method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(r.statusText);
  return r.status === 204 ? null : r.json();
}

async function load() {
  const d = await api("GET", "/state");
  P.tasks = d.tasks || [];
  P.lists = d.lists || [];
  render();
}

function spentNow(t) { return (t.spent || 0) + (t.timerStart ? (Date.now() - new Date(t.timerStart)) / 1000 : 0); }
function clock(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}
function fmtMin(m) { const h = Math.floor(m / 60), r = m % 60; return h ? `${h}ч${r ? " " + r + "м" : ""}` : `${r}м`; }

function buckets() {
  const td = today(), tm = addDays(td, 1);
  const a = P.tasks.filter(t => !t.done);
  return {
    today: a.filter(t => t.due === td),
    late: a.filter(t => t.due && t.due < td),
    tomorrow: a.filter(t => t.due === tm),
    doneToday: P.tasks.filter(t => t.done && t.completedAt && ymd(new Date(t.completedAt)) === td),
  };
}

function sortT(arr) {
  return [...arr].sort((a, b) => (b.pinned - a.pinned) || (a.dueTime || "99").localeCompare(b.dueTime || "99") || b.priority - a.priority || a.order - b.order);
}

function render() {
  const b = buckets();
  const done = b.doneToday.length, left = b.today.length + b.late.length, total = done + left;
  const pct = total ? Math.round(done / total * 100) : 0;
  $("#date").textContent = new Intl.DateTimeFormat("ru", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
  $("#mood").textContent = total ? MOODS.filter(([p]) => pct >= p).pop()[1] : "Свободный день — добавь планы или отдохни";
  $("#bar").style.width = pct + "%";
  $("#stats").innerHTML = `<span class="ok" title="Выполнено сегодня">${icon("check")} ${done}</span>` +
    (b.late.length ? `<span class="late" title="Просрочено">${icon("zap")} ${b.late.length}</span>` : "") +
    `<span class="left" title="Осталось на сегодня">${icon("clock")} ${b.today.length}</span>`;

  const run = P.tasks.find(t => t.timerStart);
  $("#running").innerHTML = run ? `<div class="running">${icon("timer")} <span class="t">${esc(run.title)}</span>
    <span class="clock" data-live="${run.id}">${clock(spentNow(run))}</span><button data-stop="${run.id}" title="Остановить">${icon("pause")}</button></div>` : "";

  for (const btn of document.querySelectorAll("#tabs button")) {
    const k = btn.dataset.tab;
    btn.classList.toggle("on", k === P.tab);
    btn.querySelector(".n").textContent = b[k].length ? b[k].length : "";
  }

  let items = sortT(b[P.tab]);
  if (P.tab === "today") items = items.concat(b.doneToday);
  $("#label").textContent = { today: "Задачи на сегодня", late: "Просроченные", tomorrow: "Задачи на завтра" }[P.tab];
  $("#list").innerHTML = items.length ? items.map(itemHTML).join("") :
    `<div class="empty"><b>${icon(P.tab === "late" ? "done" : "sun")}</b>${P.tab === "late" ? "Просроченных нет" : "Пока пусто"}</div>`;
}

function itemHTML(t) {
  const l = P.lists.find(l => l.id === t.listId);
  const sub = [];
  if (t.due && t.due < today()) sub.push(`<span class="late">${icon("date")} ${t.due.split("-").reverse().slice(0, 2).join(".")}</span>`);
  if (t.dueTime) sub.push(icon("clock") + " " + t.dueTime);
  if (l) sub.push(`<span class="dot" style="background:${l.color}"></span>${esc(l.name)}`);
  if (t.estimate) sub.push(icon("hourglass") + " " + fmtMin(t.estimate));
  if (t.subtasks.length) sub.push(`${icon("subtasks")} ${t.subtasks.filter(s => s.done).length}/${t.subtasks.length}`);
  for (const g of t.tags.slice(0, 2)) sub.push("#" + esc(g));
  return `<div class="item p${t.priority} ${t.done ? "done" : ""}" data-id="${t.id}">
    <button class="check" data-toggle="${t.id}" title="Отметить">${CHECK}</button>
    <div class="body"><div class="title">${t.pinned ? icon("pin", "inline") + " " : ""}${esc(t.title)}</div>
      <div class="sub">${sub.join(" · ") || (t.done ? "выполнено" : "без деталей")}</div></div>
    ${t.done ? "" : `<button class="play ${t.timerStart ? "on" : ""}" data-timer="${t.id}" title="Учёт времени">${icon(t.timerStart ? "pause" : "play")}</button>`}
  </div>`;
}

document.addEventListener("click", async e => {
  const el = e.target.closest("button");
  if (!el) return;
  const d = el.dataset;
  if (d.tab) { P.tab = d.tab; render(); return; }
  if (d.toggle) {
    const item = el.closest(".item");
    const done = item.classList.toggle("done");
    await Promise.all([api("POST", `/tasks/${d.toggle}/toggle`), new Promise(r => setTimeout(r, done ? 420 : 120))]);
    item.classList.add("gone");
    setTimeout(load, 220);
    return;
  }
  if (d.timer || d.stop) {
    const id = d.timer || d.stop;
    const t = P.tasks.find(x => x.id === id);
    await api("POST", `/tasks/${id}/timer/${t.timerStart ? "stop" : "start"}`);
    load(); return;
  }
  if (el.id === "openBtn") { openMain(""); return; }
  if (el.id === "browserBtn") { openInBrowser(""); return; }
  if (el.id === "sketchBtn") { openMain("sketch"); return; }
  if (d.pm) { pomo.mode(d.pm); return; }
  if (el.id === "pomoGo") { pomo.toggle(); return; }
  if (el.id === "pomoGear") { toggleSettings(); return; }
  if (el.id === "pomoReset") { pomo.reset(); return; }
  if (el.id === "pomoSkip") { pomo.skip(); return; }
  if (el.id === "quitBtn") { quitApp(); return; }
  if (el.id === "closeBtn") { hidePopup(); return; }
});

$("#addForm").addEventListener("mousedown", e => {
  if (e.target.closest("button, input")) return;
  e.preventDefault();
  $("#addInput").focus();
});
$("#addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const inp = $("#addInput");
  const p = parseQuick(inp.value, P.lists);
  if (!p.title) return;
  const due = p.due || (P.tab === "tomorrow" ? addDays(today(), 1) : today());
  await api("POST", "/tasks", {
    title: p.title, notes: "", done: false, subtasks: [], pinned: false, priority: p.priority,
    due, dueTime: p.dueTime, listId: p.listId, tags: p.tags, repeat: p.repeat,
  });
  inp.value = "";
  if (P.tab === "late") P.tab = "today";
  load();
});

document.addEventListener("keydown", e => { if (e.key === "Escape" && !e.target.closest(".pomo")) hidePopup(); });
document.addEventListener("contextmenu", e => { if (!e.target.closest("input")) e.preventDefault(); });

setInterval(() => {
  for (const el of document.querySelectorAll("[data-live]")) {
    const t = P.tasks.find(x => x.id === el.dataset.live);
    if (t) el.textContent = clock(spentNow(t));
  }
}, 1000);

// таймер общий с основным окном; когда сессия кончается, Go сам показывает эту панель
let audioCtx;
function beep() {
  try {
    audioCtx = audioCtx || new AudioContext();
    [660, 880, 990].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t0 = audioCtx.currentTime + i * 0.16;
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.55);
    });
  } catch { /* без звука */ }
}
const pomo = pomoClient(st => {
  const box = $("#pomo");
  box.className = `pomo ${st.mode} ${st.running ? "is-running" : ""} ${box.classList.contains("ring") ? "ring" : ""}`;
  if (!$("#pomoTime").querySelector("input")) $("#pomoTime").textContent = fmtMMSS(pomo ? pomo.left() : st.left);
  $("#pomoGo").innerHTML = icon(st.running ? "pause" : "play");
  $("#pomoBar").style.width = (pomo ? pomo.progress() * 100 : 0) + "%";
  $("#pomoCount").innerHTML = st.count ? '<i class="tomato"></i>'.repeat(Math.min(st.count, 8)) + (st.count > 8 ? " " + st.count : "") : "";
  $("#pomoLabel").textContent = st.label || (st.running ? (st.mode === "work" ? "Не отвлекайся — уведомлю, когда пора отдохнуть" : "Отдыхай: встань, разомнись, попей воды") : "Нажми старт, чтобы начать " + POMO_NAMES[st.mode].toLowerCase());
  document.querySelectorAll("[data-pm]").forEach(b => {
    b.classList.toggle("on", b.dataset.pm === st.mode);
    b.textContent = { work: "ФОКУС", short: "ПЕРЕРЫВ", long: "ДЛИННЫЙ" }[b.dataset.pm] + " " + st.settings[b.dataset.pm];
  });
}, st => {
  beep();
  const box = $("#pomo");
  box.classList.remove("ring"); void box.offsetWidth; box.classList.add("ring");
  setTimeout(() => box.classList.remove("ring"), 2000);
});

$("#pomoTime").addEventListener("click", () => editClock($("#pomoTime"), pomo));
bindClockArrows($("#pomo"), $("#pomoTime"), pomo);

function toggleSettings() {
  if (!pomo.state()) return; // таймер ещё не загрузился
  const box = $("#pomoSettings");
  const open = box.hidden;
  box.hidden = !open;
  $("#pomoGear").classList.toggle("on", open);
  if (!open) return;
  box.innerHTML = pomoSettingsHTML(pomo.state().settings);
  box.querySelector("[data-pset=work]").focus();
}
bindPomoSettings($("#pomoSettings"), pomo, () => { $("#pomoSettings").hidden = true; $("#pomoGear").classList.remove("on"); });

// вызывается из Go при каждом показе окна
window.onPopupShow = () => { load(); pomo.refresh(); };
load().then(async () => {
  if (location.search.includes("smoke")) {
    for (const tab of ["late", "tomorrow", "today"]) { P.tab = tab; render(); }
    toggleSettings(); toggleSettings();
    await new Promise(r => setTimeout(r, 1200)); // таймер успевает отрисоваться
  }
  document.documentElement.dataset.ready = "1";
});
</script>
</body>
